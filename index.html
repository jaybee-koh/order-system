const ST_NAME={new:'신규주문',confirmed:'주문확인',shipped:'출고완료'};
const ordStatus=o=>o.shipped?'shipped':(o.confirmed?'confirmed':'new');
/* 주문상태 조회용: 기본 상태 외에 취소건(canceled) · 반품건(returned) */
function stMatch(o,s){
  if(s==='canceled')return !!o.canceled;
  if(s==='returned')return !!(o.claim&&o.claim.req==='반품');
  return ordStatus(o)===s;
}
const CK_LBL={new:'신규주문',confirmed:'주문확인',shipped:'출고완료',canceled:'취소건',returned:'반품건'};
function stTag(o){const s=ordStatus(o);return '<span class="tag'+(s==='confirmed'?' ok':s==='shipped'?' ship':'')+'">'+ST_NAME[s]+'</span>'+(o.canceled?' <span class="tag warn">취소</span>':'')+(o.claim&&o.claim.req==='반품'?' <span class="tag gray">반품</span>':'');}
function setOrdStatus(o,st,now){
  o.confirmed=st!=='new';o.confirmedAt=st==='new'?null:(o.confirmedAt||now);
  o.shipped=st==='shipped';o.shippedAt=st==='shipped'?now:null;
}
/* 주문확인 상태인 주문에 운송장이 있으면 자동으로 출고완료로 넘깁니다. (옮겼으면 true) */
function autoShip(o,now){
  if(o.confirmed&&!o.shipped&&o.trackingNo){setOrdStatus(o,'shipped',now);return true;}
  return false;
}
const CK={init:false,d:{},a:{},page:0,sel:new Set()};
function ckRange(k){
  const t=new Date(),y=t.getFullYear(),m=t.getMonth(),day=t.getDate();
  const dd=n=>new Date(y,m,day+n);
  switch(k){
    case 'today':return [localDate(t),localDate(t)];
    case 'yesterday':return [localDate(dd(-1)),localDate(dd(-1))];
    case '7':return [localDate(dd(-6)),localDate(t)];
    case '30':return [localDate(dd(-29)),localDate(t)];
    case 'month':return [localDate(new Date(y,m,1)),localDate(new Date(y,m+1,0))];
    case 'prev':return [localDate(new Date(y,m-1,1)),localDate(new Date(y,m,0))];
  }
  return ['',''];
}
function ckInit(){
  if(CK.init)return;
  const r=ckRange('7');
  CK.d={dtype:'collected',status:'',mall:'',sup:'',from:r[0],to:r[1],field:'orderNo',q:''};

function ckList(skipStatus){
  const a=CK.a,q=norm(a.q);
  return S.orders.filter(o=>{
    const {p,s}=orderInfo(o);
    if(!p)return false;
    if(!skipStatus&&a.status&&!stMatch(o,a.status))return false;
    if(a.mall==='__none'){if(o.mall)return false;}else if(a.mall&&o.mall!==a.mall)return false;
    if(a.sup&&s.id!==+a.sup)return false;
    const cd=a.dtype==='order'?ordDateOnly(o):(o.collectedDate||'');
    if(a.from&&cd<a.from)return false;
    if(a.to&&cd>a.to)return false;
    if(q&&!norm(o[a.field]).includes(q))return false;
    return true;
  });
}

let CSO=null;
/* 택배사별 배송조회 주소 — 주소가 바뀌면 여기만 고치면 됩니다. {no} 자리에 운송장번호가 들어갑니다. */
const TRACK_URLS=[
  {m:/CJ|대한통운/i,u:'https://trace.cjlogistics.com/next/tracking.html?wblNo={no}'},
  {m:/롯데|lotte/i,u:'https://www.lotteglogis.com/home/reservation/tracking/linkView?InvNo={no}'},
  {m:/한진|hanjin/i,u:'https://www.hanjin.com/kor/CMS/DeliveryMgr/WaybillResult.do?mCode=MN038&schLang=KR&wblnumText2={no}'},
  {m:/우체국|epost/i,u:'https://service.epost.go.kr/trace.RetrieveDomRigiTraceList.comm?sid1={no}'},
  {m:/로젠|logen/i,u:'https://www.ilogen.com/web/personal/trace/{no}'}
];
function trackUrl(carrier,no){
  const n=String(no||'').replace(/[\s-]/g,'');
  const t=TRACK_URLS.find(x=>x.m.test(carrier||''));
  if(t)return t.u.replace('{no}',encodeURIComponent(n));
  /* 목록에 없는 택배사(직접 추가한 택배사 등)는 검색 결과로 연결 */
  return 'https://search.naver.com/search.naver?query='+encodeURIComponent((carrier||'택배')+' '+n);
}

async function ckDownload(list0,emptyMsg){
  /* 신규주문은 엑셀 다운로드 불가 */
  const list=list0.filter(o=>ordStatus(o)!=='new'),skipped=list0.length-list.length;
  if(!list.length){toast(list0.length?'신규주문은 엑셀을 다운로드할 수 없습니다. 주문확인으로 변경한 뒤 다운로드하세요.':emptyMsg,'err',5000);return;}
  /* 출고완료 조회 + 쇼핑몰=스마트스토어: 스마트스토어 대량 발송처리 양식(상품주문번호·배송방법·택배사·송장번호) */
  const ss=CK.a.status==='shipped'&&CK.a.mall===SS_MALL;
  /* 출고완료 주문이 포함되어 있으면 모든 항목을 다 담아서 내려받습니다 */
  const full=!ss&&list.some(o=>ordStatus(o)==='shipped');
  let rows;
  if(ss){
    rows=[['상품주문번호','배송방법','택배사','송장번호']];
    list.forEach(o=>{rows.push([o.orderNo||o.prodOrderNo||'',o.shipMethod||'',o.carrier||'',o.trackingNo||'']);});
  }else if(full){
    const cf=customFields();
    const num=v=>{if(v===''||v==null)return '';const n=Number(v);return isFinite(n)?n:String(v);};
    rows=[['번호','주문상태','수집일','주문일','쇼핑몰','쇼핑몰주문번호','상품주문번호','배송방법','자체주문번호','주문자','수취인','연락처1','연락처2','우편번호','주소','배송메모','수집상품명','수집옵션명','확정상품코드','확정상품명','확정옵션명','수량','결제금액','정산예정금액','매입처','매입가','택배사','운송장번호','출고일시','C/S 내용','C/S 처리내용'].concat(cf.map(c=>c.label))];
    list.forEach((o,i)=>{

    });
  }else{

  const now=new Date().toISOString();
  list.forEach(o=>{if(!o.exportedAt)o.exportedAt=now;});
  await putMany('orders',list);
  const noPo=ss?list.filter(o=>!o.orderNo&&!o.prodOrderNo).length:0;

}

const DEFAULT_CARRIERS=['CJ대한통운','롯데택배','한진택배','우체국택배','로젠택배'];

function tkList(){
  const a=TK.a,q=norm(a.q);
  return S.orders.filter(o=>{
    const {p,s}=orderInfo(o);
    if(!p)return false;
    if(ordStatus(o)==='new')return false;   /* 신규주문은 운송장 입력 불가 (주문확인 이후만) */
    if(a.mall==='__none'){if(o.mall)return false;}else if(a.mall&&o.mall!==a.mall)return false;
    if(a.sup&&s.id!==+a.sup)return false;
    if(a.reg?!o.trackingNo:!!o.trackingNo)return false; /* 기본: 운송장 미입력만 / 체크 시: 송장 등록된 주문만 */
    const cd=o.collectedDate||'';
    if(a.from&&cd<a.from)return false;
    if(a.to&&cd>a.to)return false;
    if(q){const v=a.field==='pName'?p.name:o[a.field];if(!norm(v).includes(q))return false;}
    return true;
  });
}

C.tkcar=el=>{

A.tksave=async()=>{
  const ids=[...TK.sel].filter(id=>M.ord.has(id)&&ordStatus(M.ord.get(id))!=='new');
  if(!ids.length){toast('저장할 주문을 체크하세요.','err');return;}
  const now=new Date().toISOString(),list=[];let bad=0;
  for(const id of ids){
    const o=M.ord.get(id),v=tkVal(o),no=String(v.no||'').replace(/[\s-]/g,'');
    if(!v.carrier||!no){bad++;continue;}
    list.push({o,carrier:v.carrier,no});
  }
  if(bad){toast('택배사와 운송장번호를 모두 입력해야 저장할 수 있습니다. (미입력 '+bad+'건 — 아무것도 저장되지 않았습니다)','err',6000);return;}
  const prev=list.map(x=>[x.o.carrier,x.o.trackingNo,x.o.trackedAt,x.o.shipped,x.o.shippedAt]);
  let shipped=0;
  list.forEach(x=>{x.o.carrier=x.carrier;x.o.trackingNo=x.no;x.o.trackedAt=now;if(autoShip(x.o,now))shipped++;});
  try{await putMany('orders',list.map(x=>x.o));}
  catch(e){list.forEach((x,i)=>{[x.o.carrier,x.o.trackingNo,x.o.trackedAt,x.o.shipped,x.o.shippedAt]=prev[i];});toast('저장 실패: '+e.message,'err',6000);return;}
  list.forEach(x=>{delete TK.edit[x.o.id];});TK.sel.clear();
  toast(list.length+'건의 운송장을 저장했습니다.'+(shipped?' (주문확인 '+shipped+'건은 출고완료로 자동 이동)':''));drawTrackTable();
};

const btCell=v=>{

  if(typeof v==='number')return isFinite(v)?String(Math.round(v)===v?v.toFixed(0):v):'';
  return String(v).trim();
};
C.btfile=async el=>{
  const f=el.files[0];if(!f)return;
  BT.items=null;BT.err='';BT.fileName=f.name;
  try{
    const sheets=await parseAny(await readFileBuf(f));
    const rows=sheets[firstNonEmptySheet(sheets)].rows;
    let h=-1,cOwn=-1,cNo=-1,cCar=-1;
    for(let i=0;i<Math.min(rows.length,10)&&h<0;i++){
      const hd=(rows[i]||[]).map(x=>norm(x));
      const a=hd.findIndex(x=>x.includes('자체주문번호'));
      if(a>=0){h=i;cOwn=a;cNo=hd.findIndex(x=>x.includes('운송장'));cCar=hd.findIndex(x=>x.includes('택배사'));}
    }
    if(h<0)throw new Error('\"자체주문번호\" 열을 찾지 못했습니다. [송장업로드양식 다운로드]로 받은 양식을 사용해 주세요.');
    if(cNo<0)throw new Error('\"운송장번호\" 열을 찾지 못했습니다. [송장업로드양식 다운로드]로 받은 양식을 사용해 주세요.');
    const items=[];
    for(let i=h+1;i<rows.length;i++){
      const r=rows[i]||[];
      const own=btCell(r[cOwn]),no=btCell(r[cNo]),car=cCar>=0?btCell(r[cCar]):'';
      if(!own&&!no&&!car)continue;
      items.push({row:i+1,own,no,car});
    }
    if(!items.length)throw new Error('저장할 데이터가 없습니다. 양식의 2번째 줄부터 입력해 주세요.');
    BT.items=items;
  }catch(e){BT.err=e.message;BT.items=null;}
  route();
};
function btCarrier(text){
  const cars=carrierList(),t=norm(text);
  const ex=cars.find(c=>norm(c)===t);if(ex)return ex;
  if(t.length>=2){const part=cars.filter(c=>norm(c).includes(t)||t.includes(norm(c)));if(part.length===1)return part[0];}
  return '';
}
A.btsave=async()=>{
  if(!BT.items||!BT.items.length){toast('운송장 파일을 먼저 선택하세요.','err');return;}
  const byOwn=new Map();
  S.orders.forEach(o=>{if(o.ownNo){if(!byOwn.has(o.ownNo))byOwn.set(o.ownNo,[]);byOwn.get(o.ownNo).push(o);}});
  const now=new Date().toISOString(),fails=[],last=new Map();
  for(const it of BT.items){
    const own=it.own.replace(/\D/g,'');
    const no=it.no.replace(/[\s-]/g,'');
    const car=it.car?btCarrier(it.car):BT.carrier;
    let why='';
    if(!own)why='자체주문번호가 비어 있습니다.';
    else if(!byOwn.has(own))why='해당 자체주문번호의 주문이 없습니다.';
    else if(!byOwn.get(own).some(o=>ordStatus(o)!=='new'))why='신규주문 상태입니다. [주문확인처리]에서 주문확인으로 변경한 뒤 입력하세요.';
    else if(!no)why='운송장번호가 비어 있습니다.';
    else if(it.car&&!car)why='등록되지 않은 택배사입니다. ('+it.car+')';
    else if(!car)why='택배사가 없습니다. 택배사를 선택하거나 파일에 입력하세요.';
    if(why){fails.push({row:it.row,own:it.own,why});continue;}
    last.set(own,{carrier:car,no});
  }
  const list=[];let shipped=0;
  last.forEach((v,own)=>{byOwn.get(own).filter(o=>ordStatus(o)!=='new').forEach(o=>{o.carrier=v.carrier;o.trackingNo=v.no;o.trackedAt=now;if(autoShip(o,now))shipped++;list.push(o);});});
  try{if(list.length)await putMany('orders',list);}
  catch(e){toast('저장 실패: '+e.message,'err',6000);return;}
  const ok=last.size;
  const failHtml=fails.length?'<h3 style="margin:14px 0 6px">입력되지 않은 건 ('+fails.length.toLocaleString()+'건)</h3><div class="tblwrap" style="max-height:240px"><table class="tbl"><thead><tr><th>엑셀 행</th><th>자체주문번호</th><th>사유</th></tr></thead><tbody>'+
    fails.slice(0,100).map(f=>'<tr><td class="nw">'+f.row+'</td><td class="nw">'+esc(f.own)+'</td><td>'+esc(f.why)+'</td></tr>').join('')+'</tbody></table></div>'+(fails.length>100?'<div class="mute small">처음 100건만 표시했습니다.</div>':''):'';
  openModal('<h2>'+(ok?'운송장입력 완료':'운송장입력 실패')+'</h2>'+
    '<div class="card" style="background:#f7f8fb;box-shadow:none;margin-bottom:0">'+(ok?'<div><b style="font-size:18px">'+ok.toLocaleString()+'건</b>의 운송장을 입력했습니다. <span class="mute small">(주문 '+list.length.toLocaleString()+'줄에 반영)</span></div>'+(shipped?'<div style="margin-top:6px">주문확인 상태였던 <b>'+shipped.toLocaleString()+'줄</b>은 <b>출고완료</b>로 자동 이동했습니다.</div>':''):'<div>저장된 운송장이 없습니다. 아래 사유를 확인해 주세요.</div>')+'</div>'+failHtml+
    '<div class="foot"><button class="btn pri" data-act="close">확인</button></div>','wide');
  BT.items=null;BT.fileName='';BT.err='';
  route();
};

function clmLastShip(o,type,req,fault){
  const nm=x=>{const {p}=orderInfo(x);return norm(p?p.name:x.itemName);};
  const key=nm(o);if(!key||!type||!req||!fault)return null;
  let best=null;
  S.orders.forEach(x=>{
    const c=x.claim;
    if(!c||x.id===o.id||c.type!==type||c.req!==req||c.fault!==fault||c.ship===''||c.ship==null)return;
    if(nm(x)!==key)return;

  });

const COLW_DEF={confirm:[3,11,8,9,21,9,15,4,12,8],check:[3,7,6,5,9,7,8,11,5,11,10,3,6,9],track:[3,7,7,6,10,8,15,15,3,8,9,9]};

function fitTable(key,heads,body){
  const w=colW(key),n=heads.length;

    '</tr></thead><tbody>'+body+'</tbody></table></div>';
}
let RZ=null;
document.addEventListener('mousedown',e=>{
  const h=e.target.closest&&e.target.closest('.rz');if(!h)return;
  e.preventDefault();e.stopPropagation();
  const table=h.closest('table'),cols=[...table.querySelectorAll('col')];
  RZ={cols,i:+h.dataset.rz,x:e.clientX,w:cols.map(c=>parseFloat(c.style.width)),total:table.getBoundingClientRect().width,key:table.dataset.colkey};
  document.body.classList.add('rzing');
});
document.addEventListener('mousemove',e=>{
  if(!RZ)return;
  const dp=(e.clientX-RZ.x)/RZ.total*100,min=2.5,pair=RZ.w[RZ.i]+RZ.w[RZ.i+1];
  let a=RZ.w[RZ.i]+dp,b=pair-a;
  if(a<min){a=min;b=pair-min;}
  if(b<min){b=min;a=pair-min;}
  RZ.cols[RZ.i].style.width=a+'%';RZ.cols[RZ.i+1].style.width=b+'%';
});
document.addEventListener('mouseup',()=>{
  if(!RZ)return;
  document.body.classList.remove('rzing');
  const r=RZ;RZ=null;
  setMeta('colw_'+r.key,r.cols.map(c=>Math.round(parseFloat(c.style.width)*100)/100));
});
document.addEventListener('dblclick',e=>{
  const h=e.target.closest&&e.target.closest('.rz');if(!h)return;
  const key=h.closest('table').dataset.colkey;
  setMeta('colw_'+key,COLW_DEF[key].slice());

});

(async function init(){
  try{
    db=await openDB();await pullFromServer();await loadAll();
    try{await ownNoBackfill();}catch(e){console.warn('자체주문번호 생성 실패',e);}
    try{const nowIso=new Date().toISOString();const mv=S.orders.filter(o=>autoShip(o,nowIso));if(mv.length)await putMany('orders',mv);}catch(e){console.warn('출고완료 자동 이동 실패',e);}
    try{
      const odf=ordDateField();
      if(odf){const chg=[];S.orders.forEach(o=>{const v=o.ex&&o.ex[odf.key];if(isXlSerial(v)){o.ex[odf.key]=xlDate(Number(v));chg.push(o);}});if(chg.length)await putMany('orders',chg);}
    }catch(e){console.warn('주문일자 정리 실패',e);}
    const oc=S.meta.orderFields;
    if(oc&&Array.isArray(oc.order)&&!oc.v2){
      if(!oc.order.includes('payAmount')){const i=oc.order.indexOf('itemOption');oc.order.splice(i>=0?i+1:oc.order.length,0,'payAmount');}
      oc.v2=true;await setMeta('orderFields',oc);
    }
    if(oc&&Array.isArray(oc.order)&&!oc.v3){
      if(!oc.order.includes('settleAmount')){let i=oc.order.indexOf('payAmount');if(i<0)i=oc.order.indexOf('itemOption');oc.order.splice(i>=0?i+1:oc.order.length,0,'settleAmount');}
      oc.v3=true;await setMeta('orderFields',oc);
    }
    try{
      const o4=S.meta.orderFields;
      if(o4&&Array.isArray(o4.order)&&!o4.v4){
        const cu=Array.isArray(o4.custom)?o4.custom:[],odf=cu.find(x=>DATE_LBL.test(x.label||''));
        if(odf){
          const pos=o4.order.indexOf(odf.key);
          if(!o4.order.includes('orderDate')){if(pos>=0)o4.order[pos]='orderDate';else o4.order.push('orderDate');}
          else if(pos>=0)o4.order.splice(pos,1);
          o4.custom=cu.filter(x=>x!==odf);
          const chg=[];
          S.orders.forEach(o=>{if(o.ex&&o.ex[odf.key]!=null){if(!o.orderDate)o.orderDate=fixDateVal(String(o.ex[odf.key]));delete o.ex[odf.key];chg.push(o);}});
          if(chg.length)await putMany('orders',chg);
          for(const k of Object.keys(S.meta)){
            const m=S.meta[k];
            if(k.startsWith('omap:')&&m&&m[odf.key]){if(!m.orderDate)m.orderDate=m[odf.key];delete m[odf.key];await setMeta(k,m);}
          }
        }else if(!o4.order.includes('orderDate')){
          const i=o4.order.indexOf('orderNo');o4.order.splice(i>=0?i+1:o4.order.length,0,'orderDate');
        }
        o4.v4=true;await setMeta('orderFields',o4);
      }
    }catch(e){console.warn('주문일 항목 이전 실패',e);}
    try{
      const o5=S.meta.orderFields;
      if(o5&&Array.isArray(o5.order)&&!o5.v5){
        const di=o5.order.indexOf('orderDate');
        if(di>=0){o5.order.splice(di,1);const oi=o5.order.indexOf('orderer');o5.order.splice(oi>=0?oi:0,0,'orderDate');}
        o5.v5=true;await setMeta('orderFields',o5);
      }
    }catch(e){console.warn('주문일 순서 이동 실패',e);}
    try{   /* 상품주문번호·배송방법 항목 추가 (스마트스토어 발송처리 양식용) */
      const o6=S.meta.orderFields;
      if(o6&&Array.isArray(o6.order)&&!o6.v6){
        if(!o6.order.includes('shipMethod')){const i=o6.order.indexOf('memo');o6.order.splice(i>=0?i+1:o6.order.length,0,'shipMethod');}
        if(!o6.order.includes('prodOrderNo')){const i=o6.order.indexOf('orderNo');o6.order.splice(i>=0?i+1:o6.order.length,0,'prodOrderNo');}
        o6.v6=true;await setMeta('orderFields',o6);
      }
    }catch(e){console.warn('상품주문번호 항목 추가 실패',e);}
    {
      const OLD=['G마켓','옥션'];
      const chg=S.orders.filter(o=>OLD.includes(o.mall));
      if(chg.length){chg.forEach(o=>{o.mall='ESM';});await putMany('orders',chg);}
      for(const k of Object.keys(S.meta)){if(k.startsWith('omall:')&&OLD.includes(S.meta[k]))await setMeta(k,'ESM');}
      if(Array.isArray(S.meta.malls)&&S.meta.malls.some(m=>OLD.includes(m)))await setMeta('malls',S.meta.malls.filter(m=>!OLD.includes(m)));
    }
    const oldPl=S.suppliers.filter(x=>x.pl);
    if(oldPl.length){oldPl.forEach(x=>{x.pl=null;});await putMany('suppliers',oldPl);}
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
    if(!location.hash)location.hash='#/home';
    route();
  }catch(e){
    $('#view').innerHTML='<div class="card err"><b>데이터를 불러올 수 없습니다.</b><br>'+esc(e.message)+'<br>인터넷 연결을 확인하고 새로고침해 주세요. 시크릿 모드가 아닌 일반 창에서 열어야 합니다.</div>';
  }
})();
})();

<script>
(function(){
  var K_ID='zian_saved_id';
  var $=function(id){return document.getElementById(id)};
  var started=false,mode='login';
  function ls(){try{return window.localStorage}catch(e){return null}}
  function lget(k){try{return ls()&&ls().getItem(k)}catch(e){return null}}
  function lset(k,v){try{ls()&&ls().setItem(k,v)}catch(e){}}
  function ldel(k){try{ls()&&ls().removeItem(k)}catch(e){}}

  async function post(path,body){
    var r;
    try{r=await fetch(path,{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(body||{})});}
    catch(e){throw new Error('서버에 연결할 수 없습니다. 인터넷 연결을 확인해 주세요.');}
    var j=null;try{j=await r.json();}catch(e){}
    if(!r.ok)throw new Error((j&&j.error)||'서버 오류가 발생했습니다. ('+r.status+')');
    return j;
  }

  function startApp(user){
    if(started)return;started=true;
    window.__USER=user;
    $('login').classList.remove('show');
    var s=document.createElement('script');
    s.textContent=$('appcode').textContent;
    document.body.appendChild(s);
  }

  function setMode(m){
    mode=m;
    document.querySelectorAll('#login .tab').forEach(function(b){b.classList.toggle('on',b.dataset.m===m)});
    var su=m==='signup';
    $('lg-pw2-wrap').hidden=!su;$('lg-hint').hidden=!su;
    $('lg-go').textContent=su?'가입하고 시작하기':'로그인';
    $('lg-pw').autocomplete=su?'new-password':'current-password';
    $('lg-err').textContent='';
  }

  function showLogin(){
    $('login').classList.add('show');$('lg-box').style.visibility='visible';
    var saved=lget(K_ID);
    if(saved){$('lg-id').value=saved;$('lg-save').checked=true;$('lg-pw').focus();}
    else $('lg-id').focus();
  }

  async function submit(e){
    e.preventDefault();
    var id=$('lg-id').value.trim().toLowerCase(),pw=$('lg-pw').value,err=$('lg-err'),btn=$('lg-go');
    err.textContent='';
    if(!id||!pw){err.textContent='아이디와 비밀번호를 입력해 주세요.';return;}
    if(mode==='signup'){
      if(!/^[a-z0-9_]{4,20}$/.test(id)){err.textContent='아이디는 영문 소문자·숫자·밑줄(_) 4~20자로 입력해 주세요.';return;}
      if(pw.length<6){err.textContent='비밀번호는 6자 이상으로 입력해 주세요.';return;}
      if(pw!==$('lg-pw2').value){err.textContent='비밀번호 확인이 일치하지 않습니다.';return;}
    }
    btn.disabled=true;
    try{
      var r=await post(mode==='signup'?'/api/signup':'/api/login',{username:id,password:pw});
      if($('lg-save').checked)lset(K_ID,r.username);else ldel(K_ID);
      $('lg-pw').value='';$('lg-pw2').value='';
      startApp(r.username);
    }catch(ex){
      err.textContent=ex.message;
      $('lg-pw').value='';
    }
    btn.disabled=false;
  }

  window.zianLogout=async function(){
    try{if(window.__drain){var ok=await window.__drain();if(!ok&&!confirm('서버에 저장되지 않은 변경이 있습니다. 그래도 로그아웃할까요?'))return;}}catch(e){}
    try{await post('/api/logout');}catch(e){}
    location.hash='';location.reload();
  };

  document.querySelectorAll('#login .tab').forEach(function(b){b.addEventListener('click',function(){setMode(b.dataset.m)})});
  $('lg-form').addEventListener('submit',submit);

  (async function boot(){
    $('login').classList.add('show');
    try{
      var r=await fetch('/api/me',{credentials:'same-origin'});
      if(r.ok){var j=await r.json();if(j&&j.username){startApp(j.username);return;}}
    }catch(e){}
    showLogin();
  })();
})();
</script>
</body>
</html>
